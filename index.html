<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pulse Music</title>
  
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a10;
      --card-bg: rgba(22, 24, 38, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(35, 38, 58, 0.8);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-1: #8b5cf6;
      --accent-2: #ec4899;
      --accent-glow: rgba(139, 92, 246, 0.35);
      --glass-panel: rgba(15, 17, 28, 0.75);
    }

    * { 
      box-sizing: border-box; margin: 0; padding: 0; 
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
    }
    .blob-1 { width: 420px; height: 420px; top: -100px; left: -80px; background: var(--accent-1); }
    .blob-2 { width: 360px; height: 360px; bottom: 120px; right: -80px; background: var(--accent-2); }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      padding: 24px 32px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      display: grid; place-items: center;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .brand-icon svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.2; }
    h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }

    button { cursor: pointer; border: 0; color: inherit; font-family: inherit; outline: none; transition: all 0.2s; }
    .btn-add {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      padding: 10px 20px; border-radius: 12px; font-weight: 600; font-size: 0.9rem;
      display: flex; align-items: center; gap: 8px; color: #fff;
      box-shadow: 0 4px 18px var(--accent-glow);
    }
    .btn-add:hover { transform: translateY(-1px); filter: brightness(1.1); }

    /* Control Bar */
    .bar {
      position: relative; z-index: 10; padding: 8px 32px 18px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .tabs {
      background: var(--card-bg); border: 1px solid var(--card-border);
      backdrop-filter: blur(12px); padding: 4px; border-radius: 12px; display: flex; gap: 4px;
    }
    .tab { background: transparent; padding: 7px 16px; border-radius: 9px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    .tab.on { background: rgba(255, 255, 255, 0.1); color: #fff; }
    
    .search-box { flex: 1; min-width: 180px; position: relative; display: flex; align-items: center; }
    .search-box svg { position: absolute; left: 14px; width: 17px; height: 17px; stroke: var(--text-muted); stroke-width: 2; pointer-events: none; }
    
    input[type=text], select {
      background: var(--card-bg); border: 1px solid var(--card-border);
      backdrop-filter: blur(12px); color: var(--text-main);
      padding: 9px 14px; border-radius: 12px; font: inherit; font-size: 0.88rem;
    }
    input[type=text] { width: 100%; padding-left: 42px; }
    input[type=text]:focus, select:focus { border-color: var(--accent-1); }

    /* List */
    #list {
      flex: 1; overflow-y: auto; padding: 4px 32px 24px; position: relative; z-index: 10;
      display: flex; flex-direction: column; gap: 6px;
    }
    #list::-webkit-scrollbar { width: 6px; }
    #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 999px; }

    .row {
      display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-radius: 14px;
      background: var(--card-bg); border: 1px solid var(--card-border);
      backdrop-filter: blur(10px); transition: background 0.2s, border-color 0.2s, transform 0.2s; cursor: pointer;
    }
    .row:hover { background: var(--card-hover); border-color: rgba(255, 255, 255, 0.15); transform: translateY(-1px); }
    .row.cur { border-color: var(--accent-1); background: rgba(139, 92, 246, 0.12); }
    .row .n { width: 24px; color: var(--text-muted); text-align: center; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    .row.cur .n { color: var(--accent-2); font-weight: 700; }
    .row .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.92rem; font-weight: 500; }
    .row.cur .t { color: #fff; font-weight: 600; }

    .ic { background: none; color: var(--text-muted); border-radius: 8px; padding: 6px; display: grid; place-items: center; }
    .ic:hover { color: #fff; }
    .ic.on { color: var(--accent-2); }
    .ic svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
    .ic.fav.on svg { fill: var(--accent-2); stroke: var(--accent-2); }

    .empty { text-align: center; color: var(--text-muted); margin: auto 0; padding: 32px 20px; }
    .empty h2 { color: #fff; font-size: 1.15rem; margin-bottom: 6px; margin-top: 12px; }

    /* Footer / Player */
    footer {
      position: relative; z-index: 20; background: var(--glass-panel);
      backdrop-filter: blur(20px); padding: 16px 32px 20px;
      border-top: 1px solid var(--card-border); display: flex; flex-direction: column; gap: 10px;
    }
    .player-meta { display: flex; align-items: center; justify-content: space-between; }
    #title { font-size: 0.95rem; font-weight: 600; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .seek { display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
    .seek input[type=range] { flex: 1; }
    input[type=range] { -webkit-appearance: none; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.15); outline: none; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: #fff; cursor: pointer; transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.25); }

    .ctrl-wrap { display: flex; align-items: center; justify-content: space-between; position: relative; }
    .ctrl-main { display: flex; align-items: center; gap: 16px; position: absolute; left: 50%; transform: translateX(-50%); }
    .ctrl-main .ic svg { width: 20px; height: 20px; }
    
    .play-btn {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
      box-shadow: 0 4px 18px var(--accent-glow);
    }
    .play-btn svg { width: 22px; height: 22px; fill: #fff; stroke: none; }
    .play-btn:hover { transform: scale(1.05); }

    .vol { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .vol svg { width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2; }
    .vol input { width: 84px; }

    body.drop { outline: 2px dashed var(--accent-1); outline-offset: -8px; }

    @media (max-width: 720px) {
      header, .bar, #list, footer { padding-left: 16px; padding-right: 16px; }
      .vol { display: none; }
      .ctrl-main { position: static; transform: none; margin: 0 auto; }
      #title { text-align: center; }
    }
  </style></head><body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      </div>
      <h1>Pulse</h1>
    </div>
    <button class="btn-add" id="addBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Add Songs
    </button>
  </header>

  <div class="bar">
    <div class="tabs">
      <button class="tab on" id="tabAll">Library</button>
      <button class="tab" id="tabFav">Favorites</button>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="search" placeholder="Search tracks...">
    </div>
    <select id="sort">
      <option value="new">Recently Added</option>
      <option value="az">Track Title (A–Z)</option>
      <option value="za">Track Title (Z–A)</option>
    </select>
  </div>

  <div id="list"></div>
  <input type="file" id="picker" accept="audio/*" multiple hidden>

  <footer>
    <div class="player-meta">
      <div id="title">Nothing playing</div>
    </div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span id="dur">0:00</span>
    </div>
    <div class="ctrl-wrap">
      <div class="ctrl-main">
        <button class="ic" id="shuf" title="Shuffle">
          <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        </button>
        <button class="ic" id="prev" title="Previous">
          <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
        </button>
        <button class="play-btn" id="play" title="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
        </button>
        <button class="ic" id="next" title="Next">
          <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
        </button>
        <button class="ic" id="rep" title="Repeat">
          <svg viewBox="0 0 24 24" id="repIcon"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
        </button>
      </div>
      <div class="vol">
        <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
      </div>
    </div>
  </footer>

  <audio id="audio"></audio>

  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const $ = id => document.getElementById(id);
    const audio = $("audio");
    let db, songs = [], view = "all", queue = [], curId = null, shuffle = false, repeat = 0, url = null;

    // ---------- storage (IndexedDB, stays on this device) ----------
    const open = () => new Promise((res, rej) => {
      const r = indexedDB.open("mymusic", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("songs", { keyPath: "id", autoIncrement: true });
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
    const store = m => db.transaction("songs", m).objectStore("songs");
    const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const loadAll = async () => { songs = await rq(store("readonly").getAll()); };
    const save = s => rq(store("readwrite").put(s));
    const remove = id => rq(store("readwrite").delete(id));

    // ---------- adding songs ----------
    async function addFiles(files) {
      for (const f of Array.from(files)) {
        if (!f.type.startsWith("audio/") && !/\.(mp3|flac|wav|m4a|aac|ogg|opus)$/i.test(f.name)) continue;
        const name = f.name.replace(/\.[^.]+$/, "");
        if (songs.some(s => s.name === name && s.blob.size === f.size)) continue;
        await save({ name, blob: f, fav: false, added: Date.now() });
      }
      await loadAll(); render();
    }
    $("addBtn").onclick = () => $("picker").click();
    $("picker").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
    window.addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("drop"); });
    window.addEventListener("dragleave", () => document.body.classList.remove("drop"));
    window.addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("drop"); addFiles(e.dataTransfer.files); });

    // ---------- list ----------
    function visible() {
      const q = $("search").value.trim().toLowerCase();
      let l = songs.filter(s => (view === "all" || s.fav) && s.name.toLowerCase().includes(q));
      const m = $("sort").value;
      if (m === "az") l.sort((a, b) => a.name.localeCompare(b.name));
      else if (m === "za") l.sort((a, b) => b.name.localeCompare(a.name));
      else l.sort((a, b) => b.added - a.added);
      return l;
    }
    function render() {
      const l = visible(), box = $("list");
      box.innerHTML = "";
      if (!l.length) {
        box.innerHTML = songs.length
          ? '<div class="empty"><h2>No matches found</h2></div>'
          : '<div class="empty"><h2>Your library is empty</h2><p>Tap <b>Add Songs</b> (or drag files onto this page).</p></div>';
        return;
      }
      l.forEach((s, i) => {
        const r = document.createElement("div");
        r.className = "row" + (s.id === curId ? " cur" : "");
        r.innerHTML = `
          <span class="n">${s.id === curId ? "▶" : i + 1}</span>
          <span class="t"></span>
          <button class="ic fav ${s.fav ? "on" : ""}" title="Favorite">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          </button>
          <button class="ic del" title="Remove">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>`;
        r.querySelector(".t").textContent = s.name;
        r.onclick = () => { queue = l.map(x => x.id); playId(s.id); };
        r.querySelector(".fav").onclick = async e => { e.stopPropagation(); s.fav = !s.fav; await save(s); render(); };
        r.querySelector(".del").onclick = async e => {
          e.stopPropagation();
          if (!confirm('Remove "' + s.name + '" from your library?')) return;
          if (s.id === curId) { audio.pause(); curId = null; $("title").textContent = "Nothing playing"; }
          await remove(s.id); await loadAll(); render();
        };
        box.appendChild(r);
      });
    }
    $("tabAll").onclick = () => setView("all");
    $("tabFav").onclick = () => setView("fav");
    function setView(v) { view = v; $("tabAll").classList.toggle("on", v === "all"); $("tabFav").classList.toggle("on", v === "fav"); render(); }
    $("search").oninput = render; $("sort").onchange = render;

    // ---------- playback ----------
    function playId(id) {
      const s = songs.find(x => x.id === id); if (!s) return;
      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(s.blob);
      audio.src = url; audio.play();
      curId = id; $("title").textContent = s.name; render();
      if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: s.name, artist: "My Music" });
    }
    function step(dir) {
      if (!queue.length) queue = visible().map(s => s.id);
      if (!queue.length) return;
      const i = queue.indexOf(curId);
      let n;
      if (shuffle && queue.length > 1) { do { n = Math.floor(Math.random() * queue.length); } while (n === i); }
      else { n = i + dir; if (n >= queue.length) n = 0; if (n < 0) n = queue.length - 1; }
      playId(queue[n]);
    }
    $("play").onclick = () => { if (!audio.src) { step(1); return; } audio.paused ? audio.play() : audio.pause(); };
    $("next").onclick = () => step(1);
    $("prev").onclick = () => { if (audio.currentTime > 3) audio.currentTime = 0; else step(-1); };
    $("shuf").onclick = () => { shuffle = !shuffle; $("shuf").classList.toggle("on", shuffle); };
    $("rep").onclick = () => {
      repeat = (repeat + 1) % 3; audio.loop = repeat === 2;
      $("rep").classList.toggle("on", repeat > 0);
      if (repeat === 2) {
        $("repIcon").innerHTML = '<path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="17 1 21 5 17 9"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path><polyline points="7 23 3 19 7 15"></polyline><text x="10" y="16" font-size="10" fill="currentColor" stroke="none">1</text>';
      } else {
        $("repIcon").innerHTML = '<polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>';
      }
    };
    audio.onplay = () => $("playIcon").innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
    audio.onpause = () => $("playIcon").innerHTML = '<polygon points="6 4 20 12 6 20 6 4"></polygon>';
    audio.onended = () => {
      const i = queue.indexOf(curId);
      if (repeat === 1 || shuffle || i < queue.length - 1) step(1);
    };
    const fmt = t => isFinite(t) ? Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0") : "0:00";
    audio.ontimeupdate = () => { $("cur").textContent = fmt(audio.currentTime); $("dur").textContent = fmt(audio.duration); $("seek").value = audio.duration ? audio.currentTime / audio.duration * 1000 : 0; };
    $("seek").oninput = () => { if (audio.duration) audio.currentTime = $("seek").value / 1000 * audio.duration; };
    $("vol").oninput = () => audio.volume = $("vol").value;
    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
      navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
    }

    // ---------- start ----------
    (async () => {
      await open(); await loadAll(); render();
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    })();
  </script></body></html>
