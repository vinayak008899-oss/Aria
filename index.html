<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<link rel="manifest" href="manifest.json">
<title>Mythological</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300;1,400&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110f;--pn:#1c1815;--rs:#262019;--hl:#2e2823;--fg:#efe8dc;--mu:#9a8f80;--pr:#e0a03c;--se:'Fraunces',Georgia,serif;--mo:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px/1.4 'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lbl,.nv span:last-child,.du{font:11px var(--mo);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.body{flex:1;display:flex;min-height:0}
#side{width:256px;flex:none;background:var(--pn);border-right:1px solid var(--hl);display:flex;flex-direction:column}
.brand{padding:32px 24px 24px}.logo{font:italic 300 1.7rem/1 var(--se)}.brand .lbl{margin-top:8px}
#side nav{padding:0 12px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border-radius:2px;color:var(--mu);text-align:left}
.nv:hover{color:var(--fg)}.nv.on{background:var(--rs);color:var(--fg)}.nv span:last-child{margin-left:auto}
.ph{display:flex;justify-content:space-between;align-items:center;padding:28px 24px 6px}
.pl{flex:1;overflow-y:auto;min-height:0}
.sf{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu{padding:8px 12px;color:var(--mu)}
.add{padding:16px;border-top:1px solid var(--hl)}
.ob{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--hl);border-radius:2px;padding:9px 16px;transition:.15s}
.ob:hover{border-color:var(--pr);color:var(--pr)}.add .ob{width:100%}
.k{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:2px;color:var(--mu);transition:.15s;flex:none}
.k:hover{color:var(--fg);background:var(--rs)}.k.on{color:var(--pr)}
.o{position:absolute;right:6px;bottom:6px;font:700 9px var(--mo);font-style:normal}
#main{flex:1;overflow-y:auto;min-width:0}
#wrap{max-width:72rem;margin:0 auto;padding:56px 48px 64px}
.hd{margin-bottom:36px}
.hd .r{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:12px}
h1{font:300 clamp(2.6rem,7vw,4.6rem)/1 var(--se);letter-spacing:-.02em}
.hd .m{font:12px var(--mo);color:var(--mu);margin-top:16px}
.pb{width:44px;height:44px;border-radius:50%;background:var(--pr);color:var(--bg);display:inline-grid;place-items:center;transition:.15s;flex:none}
.pb:hover{filter:brightness(1.08)}.pb:active{transform:scale(.96)}.pb svg{transform:translateX(1px)}
.tl{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;align-items:center}
.sr{flex:1;min-width:180px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--hl);padding:6px 0;color:var(--mu)}
.sr:focus-within{border-color:var(--pr)}
.sr input{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;min-width:0}
select{background:var(--bg);color:var(--fg);border:1px solid var(--hl);border-radius:2px;padding:8px 10px;font:12px var(--mo)}
.row{display:flex;align-items:center;gap:12px;padding:6px 8px;min-height:58px;border-bottom:1px solid rgba(46,40,35,.7);cursor:pointer;transition:background .15s}
.row:hover,.row.cur{background:var(--pn)}
.row .n{width:26px;text-align:center;flex:none}
.row img{width:44px;height:44px;border-radius:2px;object-fit:cover;flex:none;background:var(--rs)}
.tt{flex:1;min-width:0;display:flex;flex-direction:column}
.tt b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt small{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.cur .tt b{color:var(--pr)}
.none{border-top:1px solid var(--hl);padding:48px 0;color:var(--mu)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq b{width:2px;height:100%;background:var(--pr);transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:-.3s}.eq b:nth-child(3){animation-delay:-.6s}.eq.ps b{animation-play-state:paused}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.em h1{line-height:1.05;max-width:42rem;margin-top:12px}.em h1 i{color:var(--mu)}
.em p.t{color:var(--mu);max-width:32rem;margin-top:24px}
.dz{display:flex;flex-direction:column;align-items:center;justify-content:center;height:240px;width:100%;margin-top:40px;border:1px dashed var(--hl);text-align:center;transition:.15s}
.dz:hover{border-color:var(--pr)}.dz b{font:italic 400 1.8rem var(--se)}.dz span{color:var(--mu);margin-top:10px}
#bar{flex:none;display:grid;grid-template-columns:1fr 1.6fr 1fr;align-items:center;gap:16px;padding:10px 20px;background:var(--pn);border-top:1px solid var(--hl)}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.now img{width:48px;height:48px;border-radius:2px;object-fit:cover}
.now>div{display:flex;flex-direction:column;min-width:0}
.now b{font:500 1.05rem var(--se);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now small{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl{display:flex;justify-content:center;align-items:center;gap:6px}
#play{width:44px;height:44px;border-radius:50%;background:var(--pr);color:var(--bg);display:grid;place-items:center;margin:0 6px}
.sk{display:flex;align-items:center;gap:10px}.sk .lbl{width:38px;text-align:center}.sk input{flex:1}
.vol{display:flex;align-items:center;gap:8px;justify-content:flex-end}.vol input{width:96px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:16px;cursor:pointer;--fill:0%;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--pr) var(--fill),var(--hl) var(--fill))}
input[type=range]::-moz-range-track{height:2px;background:var(--hl)}
input[type=range]::-moz-range-progress{height:2px;background:var(--pr)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;border-radius:50%;background:var(--fg)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--fg)}
#tabs{display:none}.mob{display:none}
.pop{position:fixed;z-index:30;width:224px;background:var(--rs);border:1px solid var(--hl);border-radius:2px;padding:6px;box-shadow:0 8px 30px #0009}
.pop p{padding:6px 8px}.pop button{display:block;width:100%;text-align:left;padding:9px 8px;border-radius:2px}
.pop button:hover{background:var(--hl)}.pop .dg{color:#e0715a}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--rs);border:1px solid var(--hl);padding:8px 16px;font:12px var(--mo);z-index:40}
#drop{position:fixed;inset:0;z-index:50;background:rgba(20,17,15,.92);display:grid;place-items:center;pointer-events:none}
#drop div{width:min(40rem,85vw);height:60vh;border:1px dashed var(--pr);display:grid;place-content:center;text-align:center}
#drop b{font:italic 400 2.4rem var(--se)}[hidden]{display:none!important}
@media(max-width:760px){
#side{display:none}#wrap{padding:28px 18px 40px}
#bar{grid-template-columns:1fr;gap:4px;padding:8px 14px}.vol,.du{display:none}.now img{width:40px;height:40px}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--hl);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;font-size:11px;color:var(--mu)}
#tabs button.on{color:var(--pr)}#tabs svg{width:20px;height:20px}.mob{display:inline-grid}}
</style>
</head>
<body>
<div class="body"><aside id="side"></aside><main id="main"><div id="wrap"></div></main></div>
<footer id="bar">
  <div class="now"><img id="bc" alt="" hidden><div><b id="bt">Nothing playing</b><small id="ba">Choose a record</small></div></div>
  <div>
    <div class="ctl"><button class="k" id="shuf" aria-label="Shuffle"></button><button class="k" id="prev" aria-label="Previous"></button><button id="play" aria-label="Play or pause"></button><button class="k" id="next" aria-label="Next"></button><button class="k" id="rep" aria-label="Repeat"></button></div>
    <div class="sk"><span class="lbl" id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span class="lbl" id="dur">0:00</span></div>
  </div>
  <div class="vol"><span id="vi" class="k"></span><input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume"></div>
</footer>
<nav id="tabs"></nav>
<input type="file" id="picker" accept="audio/*,.mp3,.flac,.wav,.m4a,.ogg,.opus,.aac" multiple hidden>
<div id="toast" hidden></div>
<div id="drop" hidden><div><b>Let go to add</b><p class="lbl" style="margin-top:12px">mp3 · flac · wav · m4a · ogg</p></div></div>
<audio id="audio"></audio>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
const $=id=>document.getElementById(id),audio=$('audio');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',plus:'<path d="M5 12h14M12 5v14"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',play:'<polygon points="7 4 20 12 7 20 7 4"/>',pause:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',back:'<polygon points="19 20 9 12 19 4 19 20"/><path d="M5 19V5"/>',fwd:'<polygon points="5 4 15 12 5 20 5 4"/><path d="M19 5v14"/>',shuf:'<path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>',rep:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',disc:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/>',list:'<path d="M3 6h13M3 12h13M3 18h8"/><circle cx="19" cy="17" r="2"/>',vol:'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>',pen:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'};
const I=(n,x='')=>`<svg viewBox="0 0 24 24" ${x}>${IC[n]}</svg>`,FILL='style="fill:currentColor;stroke:none"';
let db,songs=[],pls=[],view={k:'lib',id:0},queue=[],shown=[],cur=null,shuf=0,rep=0,cu=null,q='',sort='new';
const CU=new Map();

// ---------- storage: same "mymusic" DB, songs untouched, playlists store added ----------
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('mymusic',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('songs'))d.createObjectStore('songs',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('playlists'))d.createObjectStore('playlists',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const st=(n,m)=>db.transaction(n,m).objectStore(n);
const rq=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});
const load=async()=>{songs=await rq(st('songs','readonly').getAll());pls=await rq(st('playlists','readonly').getAll())};
const put=(n,o)=>rq(st(n,'readwrite').put(o)),del=(n,id)=>rq(st(n,'readwrite').delete(id));

// ---------- tags + embedded cover art (ID3v2, FLAC, MP4) ----------
const u32=(b,i)=>(b[i]<<24|b[i+1]<<16|b[i+2]<<8|b[i+3])>>>0,le32=(b,i)=>(b[i]|b[i+1]<<8|b[i+2]<<16|b[i+3]<<24)>>>0;
const ss=(b,i)=>(b[i]&127)<<21|(b[i+1]&127)<<14|(b[i+2]&127)<<7|(b[i+3]&127);
const str=(b,i,j)=>new TextDecoder().decode(b.subarray(i,j));
const imgB=d=>d&&d.length>100?new Blob([d],{type:d[0]==0x89?'image/png':'image/jpeg'}):null;
const dec=(b,e)=>{if(e==1&&b[0]==0xFE)e=2;return new TextDecoder(['windows-1252','utf-16le','utf-16be','utf-8'][e]||'utf-8').decode(b).replace(/^\uFEFF|\0+$/g,'')};
function id3(b){const t={},v=b[3];let p=10;const end=Math.min(b.length,10+ss(b,6));
 if(b[5]&64)p+=v==4?ss(b,10)-0:u32(b,10)+4;
 while(p+10<end){const id=str(b,p,p+4);if(!/^[A-Z0-9]{4}$/.test(id))break;const sz=v==4?ss(b,p+4):u32(b,p+4);if(p+10+sz>b.length)break;const d=b.subarray(p+10,p+10+sz);p+=10+sz;
  if(id=='TIT2')t.title=dec(d.subarray(1),d[0]);else if(id=='TPE1')t.artist=dec(d.subarray(1),d[0]);else if(id=='TALB')t.album=dec(d.subarray(1),d[0]);
  else if(id=='APIC'&&!t.cover){let k=1;while(k<d.length&&d[k])k++;k+=2;const e=d[0];if(e==0||e==3){while(k<d.length&&d[k])k++;k++}else{while(k+1<d.length&&(d[k]||d[k+1]))k+=2;k+=2}t.cover=imgB(d.subarray(k))}}
 return t}
function flac(b){const t={};let p=4,last=0;
 while(!last&&p+4<=b.length){last=b[p]>>7;const ty=b[p]&127,len=b[p+1]<<16|b[p+2]<<8|b[p+3],s=p+4;p=s+len;if(p>b.length)break;
  if(ty==4){let k=s+4+le32(b,s);const c=le32(b,k);k+=4;for(let i=0;i<c&&k<p;i++){const l=le32(b,k),kv=str(b,k+4,k+4+l),e=kv.indexOf('='),key=kv.slice(0,e).toUpperCase(),v=kv.slice(e+1);k+=4+l;if(key=='TITLE')t.title=v;else if(key=='ARTIST')t.artist=v;else if(key=='ALBUM')t.album=v}}
  else if(ty==6&&!t.cover){let k=s+4;k+=4+u32(b,k);k+=4+u32(b,k);k+=16;t.cover=imgB(b.subarray(k+4,k+4+u32(b,k)))}}
 return t}
function mp4(b){const f=a=>{o:for(let i=0;i<b.length-24;i++){for(let j=0;j<4;j++)if(b[i+j]!=a[j])continue o;const z=u32(b,i+4);if(str(b,i+8,i+12)=='data'&&z>16)return b.subarray(i+20,i+4+z)}return null};
 const tx=a=>{const d=f(a);return d?new TextDecoder().decode(d):undefined};
 return{title:tx([169,110,97,109]),artist:tx([169,65,82,84]),album:tx([169,97,108,98]),cover:imgB(f([99,111,118,114]))}}
async function readTags(f){try{const h=new Uint8Array(await f.slice(0,10).arrayBuffer()),m4=/\.(m4a|mp4)$/i.test(f.name);let n=1.5e6;
 if(str(h,0,3)=='ID3')n=Math.min(10+ss(h,6),16e6);else if(m4)n=Math.min(f.size,48e6);else if(str(h,0,4)=='fLaC')n=8e6;
 const b=new Uint8Array(await f.slice(0,n).arrayBuffer());return str(b,0,3)=='ID3'?id3(b):str(b,0,4)=='fLaC'?flac(b):m4?mp4(b):{}}catch(e){return{}}}
const dur=f=>new Promise(r=>{const a=new Audio(),u=URL.createObjectURL(f),d=x=>{URL.revokeObjectURL(u);r(x)};a.preload='metadata';a.onloadedmetadata=()=>d(a.duration||0);a.onerror=()=>d(0);setTimeout(()=>d(0),5000);a.src=u});

// ---------- generated sleeve (fallback when a file has no embedded art) ----------
const SC=new Map();
function sleeve(seed,title){const key=seed+'|'+title;if(SC.has(key))return SC.get(key);let h=2166136261;for(const c of key){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}h>>>=0;
 const nx=()=>{h=Math.imul(h^h>>>15,2246822507)>>>0;h=(h^h>>>13)>>>0;return h};
 const INK=['#14110f','#1c1815','#2a221c','#3b2f25'],PP=['#efe8dc','#d9cbb2','#e0a03c','#b9804a','#9a8f80'],ac='#e0a03c';
 const v=nx()%4,lt=nx()%5==0,bg=lt?PP[nx()%2]:INK[nx()%4],fg=lt?INK[0]:PP[nx()%5];let o='';
 const C=(x,y,r,a)=>`<circle cx="${x}" cy="${y}" r="${r}" ${a}/>`;
 if(v==0){const cx=30+nx()%40,cy=30+nx()%40,n=5+nx()%7;for(let i=0;i<n;i++)o+=C(cx,cy,46-i*36/n,`fill="none" stroke="${fg}" stroke-width="${.5+i%3*.3}" opacity="${.35+i/n*.6}"`);o+=C(cx,cy,9,`fill="${fg==ac?INK[2]:ac}"`)+C(cx,cy,1.4,`fill="${bg}"`)}
 else if(v==1){const n=3+nx()%6;let y=10+nx()%30;for(let i=0;i<n&&y<96;i++){const t=2+nx()%9;o+=`<rect x="0" y="${y}" width="100" height="${t}" fill="${i==1?ac:fg}"/>`;y+=t+2+nx()%8}}
 else if(v==2){const l=(title.match(/[A-Za-z0-9]/)||['M'])[0].toUpperCase();o=`<text x="${8+nx()%10}" y="88" font-family="Georgia,serif" font-size="96" font-style="${nx()%2?'italic':'normal'}" fill="${fg}">${l}</text><rect x="70" y="10" width="20" height="2" fill="${ac}"/>`}
 else{const c=3+nx()%3,z=100/c;for(let i=0;i<c*c;i++){const r=nx()%4;if(!r)continue;o+=C((i%c)*z+z/2,Math.floor(i/c)*z+z/2,z/2*r/4,`fill="${r==3&&nx()%3==0?ac:fg}" opacity=".9"`)}}
 const u='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/>${o}</svg>`);SC.set(key,u);return u}

// ---------- helpers ----------
function parseName(n){const b=n.replace(/_/g,' '),p=b.split(/\s+[-–—]\s+/);let ar='',t=b;if(p.length==2)[ar,t]=p;else if(p.length>2){ar=p[0];t=p.slice(2).join(' - ')}return{title:t.replace(/^\d{1,3}[.\s-]+(?=\S)/,'')||b,artist:ar}}
const meta=s=>{const p=parseName(s.name);return{title:s.title||p.title,artist:s.artist||p.artist}};
const cov=s=>{if(s.cover){if(!CU.has(s.id))CU.set(s.id,URL.createObjectURL(s.cover));return CU.get(s.id)}return sleeve(s.name,meta(s).title)};
const fmt=t=>isFinite(t)&&t>0?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
const tot=l=>{const t=l.reduce((a,s)=>a+(s.dur||0),0),h=Math.floor(t/3600),m=Math.round(t%3600/60);return l.length+(l.length==1?' track':' tracks')+(t?' · '+(h?h+' hr ':'')+m+' min':'')};
const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)};

// ---------- adding songs ----------
async function addFiles(fs){fs=Array.from(fs);let n=0,skip=0;toast('Importing…');
 for(const f of fs){if(!/^audio\//.test(f.type)&&!/\.(mp3|flac|wav|m4a|aac|ogg|opus)$/i.test(f.name))continue;
  const name=f.name.replace(/\.[^.]+$/,'');if(songs.some(s=>s.name==name&&s.blob.size==f.size)){skip++;continue}
  const t=await readTags(f);await put('songs',{name,blob:f,fav:false,added:Date.now()+n,tagged:1,dur:await dur(f),...t});n++}
 await load();render();toast(n?n+(n==1?' song added':' songs added'):skip?'Already in your library':'No audio files found')}
async function enrich(){const old=songs.filter(s=>!s.tagged);if(!old.length)return;
 for(const s of old){Object.assign(s,await readTags(s.blob),{tagged:1});if(!s.dur)s.dur=await dur(s.blob);await put('songs',s)}
 await load();render();bar()}

// ---------- views ----------
const hd=(k,t,m,a='')=>`<div class="hd"><p class="lbl">${k}</p><div class="r"><h1 class="sf" style="max-width:100%">${esc(t)}</h1><div style="display:flex;gap:6px;align-items:center">${a}</div></div><p class="m">${m}</p></div>`;
const row=(s,i)=>{const m=meta(s),on=s.id==cur;return`<div class="row${on?' cur':''}" data-id="${s.id}"><span class="n lbl">${on?`<i class="eq${audio.paused?' ps':''}"><b></b><b></b><b></b></i>`:String(i+1).padStart(2,'0')}</span><img src="${cov(s)}" alt="" loading="lazy"><span class="tt"><b>${esc(m.title)}</b><small>${esc(m.artist||'Unknown artist')}</small></span><span class="du">${s.dur?fmt(s.dur):'—'}</span><button class="k${s.fav?' on':''}" data-a="fav" aria-label="Favorite">${I('heart',s.fav?FILL:'')}</button><button class="k" data-a="more" aria-label="More">${I('more')}</button></div>`};
function filt(l){const t=q.trim().toLowerCase();l=t?l.filter(s=>(s.name+' '+(s.title||'')+' '+(s.artist||'')+' '+(s.album||'')).toLowerCase().includes(t)):[...l];const T=s=>meta(s).title;
 if(sort=='az')l.sort((a,b)=>T(a).localeCompare(T(b)));else if(sort=='za')l.sort((a,b)=>T(b).localeCompare(T(a)));else l.sort((a,b)=>b.added-a.added);return l}
function plSongs(id){const l=pls.find(x=>x.id==id);return l?l.ids.map(i=>songs.find(s=>s.id==i)).filter(Boolean):[]}
function listHtml(){const fav=view.k=='fav',l=view.k=='pl'?plSongs(view.id):filt(fav?songs.filter(s=>s.fav):songs);shown=l.map(s=>s.id);
 return l.length?l.map(row).join(''):`<p class="none">${q?'Nothing matches “'+esc(q)+'”.':fav?'No favorites yet. Tap the heart on any song to keep it here.':view.k=='pl'?'This playlist is empty. Open the ⋯ menu on any song and choose a playlist.':'Nothing here.'}</p>`}
function renderList(){const e=$('lst');if(e)e.innerHTML=listHtml()}
const PB=`<button class="pb" data-a="playall" aria-label="Play all">${I('play',FILL)}</button>`;
const EMPTY=`<div class="em"><p class="lbl">Side A · Track 00</p><h1>The room is quiet. <i>Bring a record.</i></h1><p class="t">Your songs stay on this device, played exactly as they were recorded. Nothing is uploaded, nothing is changed.</p><button class="dz" data-a="add" style="background:none;color:inherit"><b>Drop your music here</b><span>or click to choose files — select as many as you like</span><span class="lbl">mp3 · flac · wav · m4a · ogg</span></button></div>`;
function render(){side();tabs();const v=view;let h;
 if(v.k=='pls')h=hd('Sequences','Playlists',pls.length+(pls.length==1?' playlist':' playlists'),`<button class="ob" data-a="newpl">${I('plus')} New playlist</button>`)+(pls.length?pls.map(l=>{const f=plSongs(l.id)[0];return`<div class="row" data-pl="${l.id}"><img src="${f?cov(f):sleeve('pl'+l.id,l.name)}" alt=""><span class="tt"><b class="sf">${esc(l.name)}</b><small>${l.ids.length} tracks</small></span></div>`}).join(''):'<p class="none">No playlists yet. Make one here, or use the ⋯ menu on any song.</p>');
 else if(v.k=='pl'){const l=pls.find(x=>x.id==v.id);if(!l){view={k:'pls',id:0};return render()}const s=plSongs(l.id);
  h=hd('Playlist',l.name,tot(s),(s.length?PB:'')+`<button class="k" data-a="renpl" aria-label="Rename">${I('pen')}</button><button class="k" data-a="delpl" aria-label="Delete playlist">${I('trash')}</button>`)+`<div id="lst">${listHtml()}</div>`}
 else if(!songs.length)h=EMPTY;
 else{const fav=v.k=='fav',b=fav?songs.filter(s=>s.fav):songs;
  h=hd(fav?'Kept close':'All recordings',fav?'Favorites':'Library',tot(b),(b.length?PB:'')+`<button class="k mob" data-a="add" aria-label="Add music">${I('up')}</button>`)+`<div class="tl"><label class="sr">${I('search')}<input id="q" value="${esc(q)}" placeholder="Search title, artist, album" aria-label="Search"></label><select id="so" aria-label="Sort">${[['new','Recently added'],['az','Title A–Z'],['za','Title Z–A']].map(x=>`<option value="${x[0]}"${sort==x[0]?' selected':''}>${x[1]}</option>`).join('')}</select></div><div id="lst">${listHtml()}</div>`}
 $('wrap').innerHTML=h}
function side(){const a=k=>view.k==k?' on':'';
 $('side').innerHTML=`<div class="brand"><p class="logo">Mythological</p><p class="lbl">Private listening room</p></div><nav><button class="nv${a('lib')}" data-v="lib">${I('disc')} Library<span>${songs.length}</span></button><button class="nv${a('fav')}" data-v="fav">${I('heart')} Favorites<span>${songs.filter(s=>s.fav).length}</span></button></nav><div class="ph"><button class="lbl" data-v="pls">Playlists</button><button class="k" data-a="newpl" aria-label="New playlist">${I('plus')}</button></div><nav class="pl">${pls.length?pls.map(l=>`<button class="nv${view.k=='pl'&&view.id==l.id?' on':''}" data-v="pl" data-id="${l.id}"><span class="sf">${esc(l.name)}</span><span>${l.ids.length}</span></button>`).join(''):'<p class="mu">None yet.</p>'}</nav><div class="add"><button class="ob" data-a="add">${I('up')} Add music</button></div>`}
function tabs(){const on=k=>view.k==k||(k=='pls'&&view.k=='pl')?' class="on"':'';
 $('tabs').innerHTML=[['lib','Library','disc'],['fav','Favorites','heart'],['pls','Playlists','list']].map(x=>`<button${on(x[0])} data-v="${x[0]}">${I(x[2])}${x[1]}</button>`).join('')}

// ---------- menu ----------
const closeMenu=()=>{const p=$('pop');if(p)p.remove()};
function menu(btn,s){closeMenu();const p=document.createElement('div');p.className='pop';p.id='pop';
 p.innerHTML=`<p class="lbl">Add to playlist</p>${pls.map(l=>`<button data-p="${l.id}">${l.ids.includes(s.id)?'✓ ':''}${esc(l.name)}</button>`).join('')}<button data-p="new">+ New playlist…</button>${view.k=='pl'?'<button data-p="rm">Remove from this playlist</button>':''}<button class="dg" data-p="del">Remove from library</button>`;
 document.body.appendChild(p);const r=btn.getBoundingClientRect();p.style.top=Math.max(8,Math.min(r.bottom+4,innerHeight-p.offsetHeight-8))+'px';p.style.left=Math.max(8,Math.min(r.right-224,innerWidth-232))+'px';
 p.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.p;closeMenu();
  if(k=='del'){if(!confirm('Remove "'+meta(s).title+'" from your library?'))return;if(s.id==cur){audio.pause();cur=null;bar()}for(const l of pls)if(l.ids.includes(s.id)){l.ids=l.ids.filter(i=>i!=s.id);await put('playlists',l)}await del('songs',s.id)}
  else if(k=='new'){const n=prompt('Playlist name');if(!n||!n.trim())return;await put('playlists',{name:n.trim(),ids:[s.id]})}
  else if(k=='rm'){const l=pls.find(x=>x.id==view.id);l.ids=l.ids.filter(i=>i!=s.id);await put('playlists',l)}
  else{const l=pls.find(x=>x.id==k);l.ids=l.ids.includes(s.id)?l.ids.filter(i=>i!=s.id):[...l.ids,s.id];await put('playlists',l)}
  await load();render()}}

// ---------- clicks ----------
document.addEventListener('click',async e=>{const t=e.target;
 if(!t.closest('.pop'))closeMenu();
 const v=t.closest('[data-v]');if(v){view={k:v.dataset.v,id:+v.dataset.id||0};q='';render();$('main').scrollTop=0;return}
 const a=t.closest('[data-a]'),r=t.closest('.row'),s=r&&r.dataset.id?songs.find(x=>x.id==+r.dataset.id):null,act=a&&a.dataset.a;
 if(act=='add')return $('picker').click();
 if(act=='newpl'){const n=prompt('Playlist name');if(n&&n.trim()){const id=await put('playlists',{name:n.trim(),ids:[]});await load();view={k:'pl',id};render()}return}
 if(act=='renpl'){const l=pls.find(x=>x.id==view.id),n=prompt('Rename playlist',l.name);if(n&&n.trim()){l.name=n.trim();await put('playlists',l);await load();render()}return}
 if(act=='delpl'){const l=pls.find(x=>x.id==view.id);if(confirm('Delete "'+l.name+'"? The songs stay in your library.')){await del('playlists',l.id);await load();view={k:'pls',id:0};render()}return}
 if(act=='playall'){if(shown.length)play(shown[0],shown);return}
 if(act=='fav'&&s){s.fav=!s.fav;await put('songs',s);render();return}
 if(act=='more'&&s){e.stopPropagation();menu(a,s);return}
 if(r&&r.dataset.pl){view={k:'pl',id:+r.dataset.pl};render();return}
 if(s)play(s.id,shown)});
$('wrap').addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;renderList()}});
$('wrap').addEventListener('change',e=>{if(e.target.id=='so'){sort=e.target.value;renderList()}});
$('picker').onchange=e=>{const f=Array.from(e.target.files);e.target.value='';addFiles(f)};
let dd=0;const hasF=e=>e.dataTransfer&&Array.from(e.dataTransfer.types).includes('Files');
addEventListener('dragenter',e=>{if(!hasF(e))return;e.preventDefault();dd++;$('drop').hidden=false});
addEventListener('dragover',e=>{if(hasF(e))e.preventDefault()});
addEventListener('dragleave',()=>{dd=Math.max(0,dd-1);if(!dd)$('drop').hidden=true});
addEventListener('drop',e=>{if(!hasF(e))return;e.preventDefault();dd=0;$('drop').hidden=true;addFiles(Array.from(e.dataTransfer.files))});
addEventListener('keydown',e=>{if(e.code=='Space'&&!/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)){e.preventDefault();$('play').click()}});

// ---------- playback ----------
function play(id,ids){if(ids)queue=ids;const s=songs.find(x=>x.id==id);if(!s)return;if(cu)URL.revokeObjectURL(cu);cu=URL.createObjectURL(s.blob);audio.src=cu;audio.play();cur=id;bar();render();
 if('mediaSession' in navigator){const m=meta(s);navigator.mediaSession.metadata=new MediaMetadata({title:m.title,artist:m.artist,album:s.album||'Mythological',artwork:s.cover?[{src:cov(s),sizes:'512x512',type:s.cover.type}]:[]})}}
function step(dir){if(!queue.length)queue=shown.length?shown:songs.map(s=>s.id);if(!queue.length)return;const i=queue.indexOf(cur);let n;
 if(shuf&&queue.length>1){do{n=Math.floor(Math.random()*queue.length)}while(n==i)}else{n=i+dir;if(n>=queue.length)n=0;if(n<0)n=queue.length-1}play(queue[n])}
function bar(){const s=songs.find(x=>x.id==cur),m=s&&meta(s);$('bt').textContent=s?m.title:'Nothing playing';$('ba').textContent=s?m.artist||'Unknown artist':'Choose a record';$('bc').hidden=!s;if(s)$('bc').src=cov(s)}
function icons(){$('shuf').innerHTML=I('shuf');$('prev').innerHTML=I('back');$('next').innerHTML=I('fwd');$('rep').innerHTML=I('rep')+(rep==2?'<i class="o">1</i>':'');$('vi').innerHTML=I('vol');$('play').innerHTML=I(audio.paused?'play':'pause',FILL)}
$('play').onclick=()=>{if(!audio.src){step(1);return}audio.paused?audio.play():audio.pause()};
$('next').onclick=()=>step(1);
$('prev').onclick=()=>{if(audio.currentTime>3)audio.currentTime=0;else step(-1)};
$('shuf').onclick=()=>{shuf=!shuf;$('shuf').classList.toggle('on',shuf)};
$('rep').onclick=()=>{rep=(rep+1)%3;audio.loop=rep==2;$('rep').classList.toggle('on',rep>0);icons()};
audio.onplay=audio.onpause=()=>{icons();const e=document.querySelector('.row.cur .eq');if(e)e.classList.toggle('ps',audio.paused)};
audio.onended=()=>{const i=queue.indexOf(cur);if(rep==1||shuf||i<queue.length-1)step(1)};
audio.onloadedmetadata=()=>{const s=songs.find(x=>x.id==cur);if(s&&!s.dur&&isFinite(audio.duration)){s.dur=audio.duration;put('songs',s)}};
audio.ontimeupdate=()=>{const p=audio.duration?audio.currentTime/audio.duration*1000:0;$('cur').textContent=fmt(audio.currentTime);$('dur').textContent=fmt(audio.duration);$('seek').value=p;$('seek').style.setProperty('--fill',p/10+'%')};
$('seek').oninput=()=>{if(audio.duration)audio.currentTime=$('seek').value/1000*audio.duration};
$('vol').oninput=()=>{audio.volume=$('vol').value;$('vol').style.setProperty('--fill',$('vol').value*100+'%')};
$('vol').style.setProperty('--fill','100%');
if('mediaSession' in navigator){navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1))}

// ---------- start ----------
(async()=>{icons();await open();await load();bar();render();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();enrich()})();
</script>
</body>
</html>
